# KAVACH - one container serves the main website and every dashboard on port 8001.
#   docker compose up --build            -> http://localhost:8001/
#   docker compose --profile standalone up --build
#                                        -> also runs each dashboard on its own port
services:
  kavach-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kavach-platform
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - KAVACH_OFFLINE=1
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  live-agent-swarm:
    profiles: ["standalone"]
    build: { context: ., dockerfile: Dockerfile }
    working_dir: /app/live_agent_swarm
    command: ["python", "-m", "uvicorn", "agent_engine:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    environment: [PYTHONUNBUFFERED=1]

  bharat-core-bank:
    profiles: ["standalone"]
    build: { context: ., dockerfile: Dockerfile }
    working_dir: /app/bharat_core_banking
    command: ["python", "-m", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8002"]
    ports: ["8002:8002"]
    environment: [PYTHONUNBUFFERED=1]

  real-ai-agents:
    profiles: ["standalone"]
    build: { context: ., dockerfile: Dockerfile }
    command: ["python", "-m", "uvicorn", "kavach_agent_core.server:app", "--host", "0.0.0.0", "--port", "8003"]
    ports: ["8003:8003"]
    environment: [PYTHONUNBUFFERED=1]

networks:
  default:
    name: kavach-network
