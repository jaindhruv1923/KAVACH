[phases.setup]
nixPkgs = ["python311", "curl", "git"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r kavach_platform/01_KAVACH_Platform/backend/requirements.txt"
]

[start]
cmd = "uvicorn app.main:app --app-dir kavach_platform/01_KAVACH_Platform/backend --host 0.0.0.0 --port $PORT"
