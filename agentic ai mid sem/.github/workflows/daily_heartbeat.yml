name: Daily Security & CI Telemetry Audit

on:
  schedule:
    # Runs everyday at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  telemetry-audit:
    name: Execute Daily Security & Regression Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Automated Security & Guardrail Telemetry
        id: run_telemetry
        run: |
          COMMIT_MSG=$(python KAVACH-main/scripts/daily_ci_telemetry.py)
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT

      - name: Commit and Push Verified Audit Results
        run: |
          git config user.name "Dhruv Jain"
          git config user.email "jaindhruv1923@gmail.com"
          git add KAVACH-main/docs/TELEMETRY_HEARTBEAT.md KAVACH-main/docs/TELEMETRY_LEDGER.json
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit"
          else
            git commit -m "${{ steps.run_telemetry.outputs.commit_msg }}"
            git push origin main
          fi
