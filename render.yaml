services:
  # 1. KAVACH AI DevOps Security & Governance Platform (Port 8000)
  - type: web
    name: kavach-platform
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r important/kavach/backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir important/kavach/backend
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: KAVACH_OFFLINE
        value: "1"
    healthCheckPath: /health

  # 2. Bharat Core Banking Highway Engine (Port 8050)
  - type: web
    name: bharat-banking
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r implementation_banks/requirements.txt
    startCommand: uvicorn implementation_banks.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/bank/accounts

  # 3. Unified Operations & Results Cockpit (Port 8090)
  - type: web
    name: kavach-results-hub
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r results/requirements.txt
    startCommand: uvicorn results_hub:app --host 0.0.0.0 --port $PORT --app-dir results
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/results/summary
