[pytest]
testpaths = 
    01_KAVACH_Platform/tests
    02_Banking_and_Results_Dashboard/implementation_banks
    02_Banking_and_Results_Dashboard/tests_unified
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = 
    .git
    .pytest_cache
    __pycache__
    Archived_Legacy_Materials
    03_Documentation
    04_Scratch_and_OneOff_Scripts
    node_modules
    artifacts
    venv
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::pydantic.PydanticDeprecatedSince20
