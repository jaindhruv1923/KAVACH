<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavach Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-indigo-700">Kavach Dashboard</h1>
        
        <div class="bg-white p-6 rounded shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Request Workflow</h2>
            <textarea id="requestInput" class="w-full p-2 border rounded mb-4" rows="3" placeholder="Enter your development request..."></textarea>
            <button onclick="submitRequest()" class="bg-indigo-600 text-white px-4 py-2 rounded">Initiate Kavach Workflow</button>
        </div>

        <div id="status" class="hidden bg-yellow-100 p-4 rounded mb-6 text-yellow-800">Processing...</div>
        <div id="results" class="hidden bg-white p-6 rounded shadow-md">
            <h2 class="text-xl font-semibold mb-4">Results</h2>
            <pre id="resultOutput" class="bg-gray-100 p-4 rounded overflow-x-auto"></pre>
        </div>
    </div>

    <script>
        async function submitRequest() {
            const requestText = document.getElementById('requestInput').value;
            if (!requestText) return;

            document.getElementById('status').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:8000/agent/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ request_text: requestText })
                });
                const data = await response.json();
                document.getElementById('resultOutput').textContent = JSON.stringify(data, null, 2);
                document.getElementById('results').classList.remove('hidden');
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('status').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
