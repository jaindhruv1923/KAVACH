name: Kavach CI

# Triggers on every push and every PR targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Job 1: Build, lint, unit/integration tests ---
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify backend structure
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Backend contents:"
          ls -la
          echo ""
          echo "Tests directory:"
          ls -la tests

      - name: Run test suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pytest tests -q --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: backend/pytest-results.xml

  # --- Job 2: Kavach security + impact-analysis quality gate ---
  security-gate:
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Kavach security + impact-analysis gate
        run: |
          python ci_security_gate.py

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: backend/security_gate_report.json

  # --- Job 3: Report summary ---
  report:
    runs-on: ubuntu-latest
    needs: [test, security-gate]
    if: always()

    steps:
      - name: Pipeline summary
        run: |
          echo "## Kavach CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test job result: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Security gate result: ${{ needs.security-gate.result }}" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.security-gate.result }}" = "success" ]; then
            echo "- Overall result: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Overall result: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi