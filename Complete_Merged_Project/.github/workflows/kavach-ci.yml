name: Kavach CI

# Triggers on every push and every PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ============================================================
  # JOB 1: Build, install dependencies, and run tests
  # ============================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run test suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pytest -q --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml


  # ============================================================
  # JOB 2: Kavach security gate
  # ============================================================
  security-gate:
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Kavach security + impact-analysis gate
        run: python ci_security_gate.py

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: backend/security_gate_report.json


  # ============================================================
  # JOB 3: Final pipeline summary
  # ============================================================
  report:
    runs-on: ubuntu-latest
    needs: [test, security-gate]
    if: always()

    steps:
      - name: Pipeline summary
        run: |
          echo "## Kavach CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test job result: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Security gate result: ${{ needs.security-gate.result }}" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.security-gate.result }}" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Overall result: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Overall result: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi