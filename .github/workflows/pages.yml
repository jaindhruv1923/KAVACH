name: Deploy KAVACH Platform to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Assemble Unified Multi-Dashboard Pages Bundle
        run: |
          mkdir -p _site
          cp -r "PRJ-IV &AgenticAi Final Work/kavach_platform/01_KAVACH_Platform/frontend/"* _site/
          mkdir -p _site/swarm
          cp -r "PRJ-IV &AgenticAi Final Work/live_agent_swarm/"* _site/swarm/
          mkdir -p _site/bank
          cp -r "PRJ-IV &AgenticAi Final Work/bharat_core_banking/"* _site/bank/
          mkdir -p _site/cockpit
          cp -r "PRJ-IV &AgenticAi Final Work/kavach_agent_core/"* _site/cockpit/
          if [ -f "_site/cockpit/cockpit.html" ]; then
            cp _site/cockpit/cockpit.html _site/cockpit/index.html
          fi
          mkdir -p _site/suite
          cp -r "PRJ-IV &AgenticAi Final Work/shared_ui/"* _site/suite/
          mkdir -p _site/shared_ui
          cp -r "PRJ-IV &AgenticAi Final Work/shared_ui/"* _site/shared_ui/
          mkdir -p _site/reports
          cp -r "PRJ-IV &AgenticAi Final Work/kavach_platform/agentic_ai_midsem/"* _site/reports/
          mkdir -p _site/motion
          cp -r "PRJ-IV &AgenticAi Final Work/kavach_platform/motion_graphics/"* _site/motion/
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
