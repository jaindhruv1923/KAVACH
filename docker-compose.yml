version: '3.8'

services:
  # 1. KAVACH Platform API Gateway & Sentinel Engine (Port 8000)
  kavach-platform:
    build:
      context: ./agentic_ai_midsem_work/KAVACH-main
      dockerfile: Dockerfile
    container_name: kavach-platform-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - KAVACH_OFFLINE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./agentic_ai_midsem_work/KAVACH-main/01_KAVACH_Platform/backend/data:/app/backend/data
      - ./agentic_ai_midsem_work/KAVACH-main/02_Banking_and_Results_Dashboard/results_dashboard/data:/app/results_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # 2. Bharat Core Banking Highway Engine (Port 8050)
  bharat-core-banking:
    build:
      context: ./agentic_ai_midsem_work/KAVACH-main
      dockerfile: Dockerfile
    container_name: bharat-banking-highway
    ports:
      - "8050:8050"
    environment:
      - PORT=8050
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "uvicorn", "implementation_banks.server:app", "--app-dir", "02_Banking_and_Results_Dashboard", "--host", "0.0.0.0", "--port", "8050"]
    volumes:
      - ./agentic_ai_midsem_work/KAVACH-main/02_Banking_and_Results_Dashboard/implementation_banks/data:/app/implementation_banks/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # 3. Unified Operations & Results Cockpit (Port 8090)
  results-cockpit:
    build:
      context: ./agentic_ai_midsem_work/KAVACH-main
      dockerfile: Dockerfile
    container_name: kavach-results-hub
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "uvicorn", "results_hub:app", "--app-dir", "02_Banking_and_Results_Dashboard/results_dashboard", "--host", "0.0.0.0", "--port", "8090"]
    volumes:
      - ./agentic_ai_midsem_work/KAVACH-main/02_Banking_and_Results_Dashboard/results_dashboard/data:/app/results/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: kavach-mesh-network
